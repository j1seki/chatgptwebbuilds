services:
  - type: web
    name: shared-terminal-api
    runtime: node
    rootDir: shared-terminal
    plan: free
    region: ohio
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://shared-terminal-ui-00rp.onrender.com

  - type: web
    name: shared-terminal-ui
    runtime: static
    rootDir: shared-terminal
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp
    envVars:
      - key: VITE_API_URL
        value: https://shared-terminal-api-00rp.onrender.com
