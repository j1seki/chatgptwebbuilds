services:
  - type: web
    name: shared-terminal-api
    runtime: node
    rootDir: shared-terminal
    plan: free
    region: ohio
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: "*"
