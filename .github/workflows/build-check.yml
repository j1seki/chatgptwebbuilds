name: Build check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Check OpenCode catalog refresh script
        run: node --check scripts/refresh-opencode-catalog.mjs
      - name: Build shared terminal
        run: npm install && npm run build
        working-directory: shared-terminal
