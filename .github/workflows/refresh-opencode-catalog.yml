name: Refresh OpenCode free model catalog
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: opencode-catalog-refresh
  cancel-in-progress: true
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh and commit catalog snapshot
        run: |
          node scripts/refresh-opencode-catalog.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opencode-free/data.json
          if git diff --cached --quiet; then
            echo "Catalog snapshot unchanged."
          else
            git commit -m "chore: refresh OpenCode free model catalog"
            git push
          fi
